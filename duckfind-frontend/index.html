<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DuckFind finds internships that fit you, including UK roles at visa-sponsoring companies." />
    <title>DuckFind – Find internships that fit you</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Turns dark mode on before the page draws, so it doesn't flash white (see ThemeProvider.jsx)
      try {
        var saved = localStorage.getItem('duckfind-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (error) {
        // storage blocked: the app will follow the device setting once it loads
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
